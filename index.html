<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondage Veluume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sand: #FAF8F5;
            --card-bg: #FFFFFF;
            --border: #E8E2D9;
            --terracotta: #C86D51;
            --terracotta-dark: #A75239;
            --olive: #6D775C;
            --charcoal: #2A2826;
            --muted: #7A7571;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-sand);
            color: var(--charcoal);
            margin: 0;
            padding: 0;
            padding-bottom: 120px;
        }

        header {
            background: rgba(250, 248, 245, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 24px 20px 18px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            margin-bottom: 12px;
        }

        .brand-logo {
            max-height: 40px;
            width: auto;
            display: inline-block;
        }

        .intro-text { 
            font-size: 0.9rem; 
            color: var(--muted); 
            line-height: 1.5; 
            max-width: 440px;
            margin: 0 auto 16px auto;
        }

        .name-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            margin-bottom: 10px;
            text-align: center;
            transition: all 0.2s ease;
            color: var(--charcoal);
        }
        .name-input:focus { 
            border-color: var(--terracotta); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(200, 109, 81, 0.1);
        }

        .counter {
            background: var(--charcoal);
            color: #FAF8F5;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .counter.complete { 
            background: var(--olive); 
        }

        .container {
            padding: 20px 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(42, 40, 38, 0.03);
            position: relative;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            background: #F2EDE6;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            color: var(--charcoal);
            border: 1px solid var(--border);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            z-index: 10;
            padding: 0;
            transition: background 0.2s;
        }
        .slider-btn:hover {
            background: white;
        }
        .slider-btn.prev { left: 10px; }
        .slider-btn.next { right: 10px; }

        .slider-indicator {
            position: absolute;
            bottom: 10px;
            right: 12px;
            background: rgba(42, 40, 38, 0.65);
            color: white;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 0.05em;
        }

        .image-header {
            padding: 10px 16px;
            font-family: 'Caveat', cursive;
            font-size: 1.7rem;
            line-height: 1;
            color: #e84d17;
            border-bottom: 1px solid var(--border);
            background: #FCFAF7;
        }

        .controls {
            padding: 14px 14px 6px 14px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        button {
            padding: 12px 4px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--charcoal);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .comment-toggle-btn {
            width: calc(100% - 28px);
            margin: 6px 14px 14px 14px;
            padding: 9px;
            background-color: transparent;
            border: 1px dashed var(--border);
            font-size: 0.75rem;
            color: var(--muted);
            flex-direction: row;
        }

        button.selected { 
            border-color: transparent; 
            color: white; 
            transform: translateY(-1px); 
        }

        .btn-top4.selected { background-color: var(--terracotta); color: white; }
        .btn-like.selected { background-color: var(--olive); color: white; }
        .btn-dislike.selected { background-color: #9E968F; color: white; }
        
        .comment-toggle-btn.has-text { 
            background-color: rgba(200, 109, 81, 0.08); 
            border-color: var(--terracotta); 
            color: var(--terracotta);
            font-weight: 600;
        }

        .feedback-box {
            display: none;
            padding: 0 14px 14px 14px;
        }
        
        .feedback-box textarea, .general-ideas textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--charcoal);
            box-sizing: border-box;
            background: #FCFAF7;
            min-height: 70px;
            resize: vertical;
        }
        .feedback-box textarea:focus, .general-ideas textarea:focus {
            outline: none;
            border-color: var(--terracotta);
        }

        .general-ideas {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-top: 15px;
        }
        .general-ideas h3 { 
            margin: 0 0 6px 0; 
            font-size: 1rem; 
            font-weight: 600;
            color: var(--charcoal); 
        }
        .general-ideas p {
            font-size: 0.8rem;
            color: var(--muted);
            margin: 0 0 12px 0;
        }

        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(250, 248, 245, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            display: none;
            z-index: 200;
        }

        .submit-btn {
            background: var(--terracotta);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            flex-direction: row;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/SS27/Logo-veluume_ornage.png" alt="Veluume" class="brand-logo">
        </div>
        <p class="intro-text">Donne-nous ton avis direct : choisis tes 4 favoris (Top 4).</p>
        
        <div style="max-width: 380px; margin: 0 auto;">
            <input type="text" id="userName" class="name-input" placeholder="Ton prénom (obligatoire)" required>
            <div class="counter" id="counter">Top 4 choisis : 0 / 4</div>
        </div>
    </header>

    <form id="mainForm" action="https://formspree.io/f/mbddpagp" method="POST">
        
        <input type="hidden" name="Prenom_Utilisateur" id="hiddenName">
        
        <div class="container" id="gallery"></div>

        <div class="container">
            <div class="general-ideas">
                <h3>Une autre idée en tête ?</h3>
                <p>Motifs, couleurs ou matières que tu aimerais voir arriver :</p>
                <textarea name="Idée_Generale" placeholder="Ex. : Des motifs rayés, des tons plus beiges..."></textarea>
            </div>
        </div>

        <input type="hidden" name="Resultats_Complets" id="finalData">

        <div class="footer-bar" id="footerBar">
            <button type="submit" class="submit-btn">Envoyer mes votes</button>
        </div>
    </form>

    <script>
        const maxSelection = 4;
        
        // Configuration détaillée des 18 modèles
        const itemsConfig = [
            { id: 1,  type: 'single', images: ['images/SS27/img1.jpg'] },
            { id: 2,  type: 'single', images: ['images/SS27/img2.jpg'] },
            { id: 3,  type: 'single', images: ['images/SS27/img3.jpg'] },
            { id: 4,  type: 'single', images: ['images/SS27/img4.jpg'] },
            { id: 5,  type: 'single', images: ['images/SS27/img5.jpg'] },
            { id: 6,  type: 'single', images: ['images/SS27/img6.jpg'] },
            { id: 7,  type: 'single', images: ['images/SS27/img7.jpg'] },
            { id: 8,  type: 'single', images: ['images/SS27/img8.png'] }, 
            { id: 9,  type: 'multi',  images: ['images/SS27/img17.jpg', 'images/SS27/img21.jpg'] },
            { id: 10, type: 'single', images: ['images/SS27/img10.jpg'] },
            { id: 11, type: 'single', images: ['images/SS27/img11.jpg'] },
            { id: 12, type: 'single', images: ['images/SS27/img12.jpg'] },
            { id: 13, type: 'multi',  images: ['images/SS27/img13.jpg', 'images/SS27/img22.jpg', 'images/SS27/img19.jpg'] }, // n°13 avec 13, 22 et 019
            { id: 14, type: 'single', images: ['images/SS27/img14.jpg'] },
            { id: 15, type: 'single', images: ['images/SS27/img15.jpg'] },
            { id: 16, type: 'single', images: ['images/SS27/img16.jpg'] },
            { id: 17, type: 'single', images: ['images/SS27/img20.jpg'] }, // Ajout éventail 17
            { id: 18, type: 'single', images: ['images/SS27/img18.jpg'] }  // Ajout éventail 18
        ];

        const gallery = document.getElementById('gallery');
        const counterDisplay = document.getElementById('counter');
        const footerBar = document.getElementById('footerBar');
        const finalDataInput = document.getElementById('finalData');
        const mainForm = document.getElementById('mainForm');
        const nameInput = document.getElementById('userName');
        const hiddenNameInput = document.getElementById('hiddenName');

        let userVotes = {};
        let sliderIndices = {};

        // Génération des cartes
        itemsConfig.forEach(item => {
            userVotes[item.id] = "Neutre";
            sliderIndices[item.id] = 0;

            const card = document.createElement('div');
            card.className = 'card';

            let imageHtml = '';
            if (item.type === 'multi') {
                imageHtml = `
                    <div class="image-wrapper">
                        <button type="button" class="slider-btn prev" onclick="changeSlide(${item.id}, -1)">‹</button>
                        <img id="img-slider-${item.id}" src="${item.images[0]}" alt="Éventail ${item.id}" loading="lazy">
                        <button type="button" class="slider-btn next" onclick="changeSlide(${item.id}, 1)">›</button>
                        <div class="slider-indicator" id="indicator-${item.id}">1 / ${item.images.length}</div>
                    </div>
                `;
            } else {
                imageHtml = `
                    <div class="image-wrapper">
                        <img src="${item.images[0]}" alt="Éventail ${item.id}" loading="lazy">
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="image-header">Éventail n°${item.id}</div>
                ${imageHtml}
                
                <div class="controls" id="ctrl-${item.id}">
                    <button type="button" class="btn-top4" onclick="setVote(${item.id}, 'Top 4', this)">
                        <span>✦</span> Top 4
                    </button>
                    <button type="button" class="btn-like" onclick="setVote(${item.id}, 'J\\'aime', this)">
                        <span>👍</span> J'aime
                    </button>
                    <button type="button" class="btn-dislike" onclick="setVote(${item.id}, 'Bof', this)">
                        <span>—</span> Moins fan
                    </button>
                </div>

                <button type="button" class="comment-toggle-btn" id="btn-com-${item.id}" onclick="toggleComment(${item.id})">
                    Un détail à modifier ?
                </button>

                <div class="feedback-box" id="feedback-box-${item.id}">
                    <textarea id="text-${item.id}" oninput="checkCommentInput(${item.id})" placeholder="Changer les couleurs, le motif..."></textarea>
                </div>
            `;
            gallery.appendChild(card);
        });

        // Défilement carrousels
        function changeSlide(id, step) {
            const config = itemsConfig.find(item => item.id === id);
            sliderIndices[id] = (sliderIndices[id] + step + config.images.length) % config.images.length;
            
            document.getElementById(`img-slider-${id}`).src = config.images[sliderIndices[id]];
            document.getElementById(`indicator-${id}`).innerText = `${sliderIndices[id] + 1} / ${config.images.length}`;
        }

        function setVote(id, type, btnElement) {
            const currentTop4 = countTop4();

            if (type === 'Top 4' && currentTop4 >= maxSelection && userVotes[id] !== 'Top 4') {
                alert("Tu as déjà sélectionné 4 favoris ! Décoche-en un pour changer.");
                return;
            }

            if (userVotes[id] === type) {
                userVotes[id] = "Neutre";
                resetButtons(id);
            } else {
                userVotes[id] = type;
                highlightButton(id, btnElement);
            }

            updateUI();
        }

        function toggleComment(id) {
            const box = document.getElementById(`feedback-box-${id}`);
            const isHidden = window.getComputedStyle(box).display === 'none';
            box.style.display = isHidden ? 'block' : 'none';
            if (isHidden) {
                document.getElementById(`text-${id}`).focus();
            }
        }

        function checkCommentInput(id) {
            const text = document.getElementById(`text-${id}`).value.trim();
            const btn = document.getElementById(`btn-com-${id}`);
            
            if (text.length > 0) {
                btn.classList.add('has-text');
                btn.innerText = "✓ Remarque ajoutée";
            } else {
                btn.classList.remove('has-text');
                btn.innerText = "Un détail à modifier ?";
            }
        }

        function resetButtons(id) {
            const buttons = document.querySelectorAll(`#ctrl-${id} button`);
            buttons.forEach(b => b.classList.remove('selected'));
        }

        function highlightButton(id, activeBtn) {
            resetButtons(id);
            activeBtn.classList.add('selected');
        }

        function countTop4() {
            return Object.values(userVotes).filter(v => v === 'Top 4').length;
        }

        function updateUI() {
            const count = countTop4();
            counterDisplay.innerText = `Top 4 choisis : ${count} / ${maxSelection}`;
            
            if (count === maxSelection) {
                counterDisplay.classList.add('complete');
                footerBar.style.display = 'block';
            } else {
                counterDisplay.classList.remove('complete');
                footerBar.style.display = 'none';
            }
        }

        mainForm.onsubmit = function(e) {
            if (nameInput.value.trim() === "") {
                e.preventDefault();
                alert("Merci d'indiquer ton prénom tout en haut !");
                window.scrollTo({ top: 0, behavior: 'smooth' });
                nameInput.focus();
                return;
            }

            if (countTop4() !== maxSelection) {
                e.preventDefault();
                alert("Sélectionne exactement 4 favoris en 'Top 4'.");
                return;
            }

            hiddenNameInput.value = nameInput.value;
            let finalResult = {};

            itemsConfig.forEach(item => {
                let vote = userVotes[item.id];
                let comment = document.getElementById(`text-${item.id}`).value.trim();
                
                if (vote !== "Neutre" || comment !== "") {
                    let entry = vote;
                    if (comment !== "") {
                        entry += ` | NOTE: ${comment}`;
                    }
                    finalResult[`Éventail ${item.id}`] = entry;
                }
            });
            
            finalDataInput.value = JSON.stringify(finalResult, null, 2);
        };
    </script>
</body>
</html>
